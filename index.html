<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chainwolf</title>
<meta name="app-version" content="0.3.0">
<meta name="theme-color" content="#070b09">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=0.3.0">
</head>
<body>
<main>
  <header class="brand">
    <img src="logo.png?v=0.3.0" alt="Generify Data Intelligence" width="64" height="64">
    <div>
      <h1>Chainwolf</h1>
      <p class="sub">Check a payment or wallet on the network it was sent on.</p>
    </div>
  </header>

  <div class="nets" id="nets" role="group" aria-label="Network"></div>

  <form id="f" autocomplete="off">
    <div class="field">
      <input id="txid" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="Transaction ID or address" aria-label="Transaction ID or wallet address">
      <button id="clr" class="icon" type="button" aria-label="Clear" hidden>&times;</button>
    </div>
    <button id="go" type="submit">Check</button>
  </form>

  <div id="msg" role="alert" hidden></div>

  <section id="result" aria-live="polite" hidden>
    <a href="#" id="back" hidden>&larr; Back to address</a>
    <div class="idrow">
      <span class="kind" id="kind"></span>
      <code id="idText"></code>
      <button class="mini" id="copyBtn" type="button">Copy</button>
      <a class="mini" id="ext" target="_blank" rel="noopener noreferrer">Open explorer</a>
    </div>
    <div id="status" class="status">
      <div class="big" id="sBig"></div>
      <div class="small" id="sSmall"></div>
      <div class="pips" id="pips" hidden><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="note" id="sNote" hidden></div>
    </div>
    <div class="watchbar" id="watchbar">
      <div class="field" id="wfield"><input id="wlabel" type="text" maxlength="40" placeholder="Label (optional)" aria-label="Watchlist label"></div>
      <span class="state" id="wstate" hidden>On your watchlist</span>
      <button class="mini" id="wbtn" type="button">Watch</button>
    </div>
    <dl id="rows"></dl>
    <div id="outs" hidden><h2 id="outsTitle">Outputs</h2><div id="outitems"></div></div>
    <div id="txlist" hidden><h2>Recent transactions</h2><div id="txitems"></div></div>
    <p class="foot" id="foot"></p>
  </section>

  <section id="watch" hidden>
    <div class="whead"><h2>Watchlist</h2><button class="mini" id="wrefresh" type="button">Refresh</button></div>
    <div id="witems"></div>
    <p id="wnote"></p>
  </section>

  <p class="ver">Chainwolf v0.3.0 by Generify Data Intelligence</p>
</main>
<script src="chains.js?v=0.3.0"></script>
<script src="app.js?v=0.3.0"></script>
</body>
</html>
